<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="https://wellspringcf.org/favicon.ico">
  <title>Workshop Registrations - Admin Dashboard</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1.25rem;
      display: flex;
      justify-content: center;
    }

    .dashboard {
      width: 100%;
      max-width: 800px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .refresh-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .refresh-btn:hover {
      background-color: var(--primary-hover);
    }

    /* Metric Cards Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
    }

    .metric-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    .metric-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Registrants Table Section */
    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 1.1rem;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem 1.5rem;
      font-size: 0.95rem;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #475569;
      border-bottom: 1px solid var(--border);
    }

    tr:not(:last-child) td {
      border-bottom: 1px solid #f1f5f9;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <header>
      <h1>Registrations Dashboard</h1>
      <button class="refresh-btn" onclick="loadDashboardData()">Refresh</button>
    </header>

    <!-- 3 Summary Cards -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">Total Registrations</div>
        <div id="totalRegistrations" class="metric-value">-</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Percentage Filled</div>
        <div id="percentageFilled" class="metric-value">-</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Remaining Seats</div>
        <div id="remainingSeats" class="metric-value">-</div>
      </div>
    </div>

    <!-- Registrants Table -->
    <div class="table-container">
      <div class="table-header">Registered Attendees</div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Full Name</th>
            <th>Date Registered</th>
          </tr>
        </thead>
        <tbody id="registrantsTableBody">
          <tr>
            <td colspan="3" class="empty-state">Loading participants...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Configuration
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhC7wW1xN_p6GhB4j5FOFUll6d7zitozdE6s2Mj4-9gaSJBv2vU2AcPE6wJfrc8pUh/exec';
    const MAX_CAPACITY = 25; // Keep matching your registration form capacity

    async function loadDashboardData() {
      const totalEl = document.getElementById('totalRegistrations');
      const percentEl = document.getElementById('percentageFilled');
      const remainingEl = document.getElementById('remainingSeats');
      const tableBody = document.getElementById('registrantsTableBody');

      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        const count = data.count || 0;
        const registrants = data.registrants || [];

        // 1. Calculate metrics
        const percentage = Math.min(100, Math.round((count / MAX_CAPACITY) * 100));
        const remaining = Math.max(0, MAX_CAPACITY - count);

        totalEl.innerText = `${count} / ${MAX_CAPACITY}`;
        percentEl.innerText = `${percentage}%`;
        remainingEl.innerText = remaining;

        // 2. Populate Table
        if (registrants.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="3" class="empty-state">No registrations yet.</td></tr>`;
          return;
        }

        let rowsHtml = '';
        registrants.forEach((reg, index) => {
          const dateObj = new Date(reg.timestamp);
          const formattedDate = isNaN(dateObj) ? reg.timestamp : dateObj.toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
          });

          rowsHtml += `
            <tr>
              <td>${index + 1}</td>
              <td><strong>${escapeHtml(reg.fullName)}</strong></td>
              <td>${formattedDate}</td>
            </tr>
          `;
        });

        tableBody.innerHTML = rowsHtml;

      } catch (err) {
        totalEl.innerText = 'Error';
        percentEl.innerText = 'Error';
        remainingEl.innerText = 'Error';
        tableBody.innerHTML = `<tr><td colspan="3" class="empty-state" style="color: #dc2626;">Failed to load data. Please try refreshing.</td></tr>`;
      }
    }

    // Helper to prevent injection
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Load on page startup
    loadDashboardData();
  </script>

</body>
</html>
