<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" type="image/x-icon" href="https://wellspringcf.org/favicon.ico">
  <title>Workshop Registration</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.25rem;
    }

    .container {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      width: 100%;
      max-width: 440px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1.75rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .status-msg.success {
      display: block;
      color: #16a34a;
    }

    .status-msg.error {
      display: block;
      color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Workshop Registration</h1>
    <p class="subtitle">Please enter your details below to confirm your spot at our upcoming workshop. Space is limited so sign up soon!
      <br><bR>
      Feel free to bring something to share for the potluck and/or consider a donation.
    </p>

    <form id="rsvpForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <button type="submit" id="submitBtn">Register Now</button>
      <div id="status" class="status-msg"></div>
    </form>


  </div>

  <script>
    // Replace with your Google Apps Script Web App URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhC7wW1xN_p6GhB4j5FOFUll6d7zitozdE6s2Mj4-9gaSJBv2vU2AcPE6wJfrc8pUh/exec';

    const form = document.getElementById('rsvpForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';
      statusMsg.className = 'status-msg';
      statusMsg.innerText = '';

      const payload = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Bypasses CORS requirements for Google Apps Script redirects
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        statusMsg.className = 'status-msg success';
        statusMsg.innerText = 'Thank you! Your RSVP has been received.';
        form.reset();
      } catch (err) {
        statusMsg.className = 'status-msg error';
        statusMsg.innerText = 'Oops! Something went wrong. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Register Now';
      }
    });
  </script>

</body>
</html>
